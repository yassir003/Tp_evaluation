# Configuration de la connexion à la base de données (MySQL)
hibernate.connection.driver_class=com.mysql.cj.jdbc.Driver
hibernate.connection.url=jdbc:mysql://localhost:3306/etat_civil?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
hibernate.connection.username=root
hibernate.connection.password=

# Dialecte SQL et gestion automatique du schéma
hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
hibernate.hbm2ddl.auto=create-drop

# Journalisation des requêtes SQL
hibernate.show_sql=true
hibernate.format_sql=true
